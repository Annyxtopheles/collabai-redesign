<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CollabAI — AI Agent Collaboration Platform</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/collab-ai-icon.svg" />
  
  <!-- Inter, Cousine, Sniglet, VT323 & Orbitron Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cousine:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Sniglet:wght@400;800&family=VT323&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN with CSS Variable-driven Theme Tokens -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Cousine', 'monospace'],
            sniglet: ['Sniglet', 'cursive', 'sans-serif'],
            vt323: ['VT323', 'monospace'],
            orbitron: ['Orbitron', 'sans-serif']
          },
          colors: {
            app: {
              canvas: 'var(--bg-canvas)',
              sidebar: 'var(--bg-sidebar)',
              surface: 'var(--bg-surface)',
              elevated: 'var(--bg-elevated)',
              input: 'var(--bg-input)',
              hover: 'var(--bg-hover)',
              hoverSubtle: 'var(--bg-hover-subtle)',
              borderSubtle: 'var(--border-subtle)',
              borderMed: 'var(--border-med)',
              borderActive: 'var(--border-active)',
              accent: 'var(--btn-primary-bg)',
              accentHover: 'var(--btn-primary-hover)',
              textPrimary: 'var(--text-primary)',
              textSecondary: 'var(--text-secondary)',
              textMuted: 'var(--text-muted)',
              success: '#10B981',
              purple: '#8B5CF6',
              red: '#EF4444'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Marked for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-app-canvas text-app-textPrimary font-sans antialiased overflow-hidden">
  
  <!-- App View Root Layer -->
  <div id="app-root" class="h-screen w-screen flex overflow-hidden relative z-10">
    <!-- Rendered Dynamically by app.js -->
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <div id="modal-container" class="relative z-50"></div>

  <!-- Core Scripts -->
  <script src="/js/types.js"></script>
  <script src="/js/utils/time.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/components/SparklesBackground.js"></script>
  <script src="/js/components/Sidebar.js"></script>
  <script src="/js/components/HeaderBreadcrumb.js"></script>
  <script src="/js/components/LoginView.js"></script>
  <script src="/js/components/DashboardView.js"></script>
  <script src="/js/components/ConversationsView.js"></script>
  <script src="/js/components/AgentsView.js"></script>
  <script src="/js/components/ProjectsView.js"></script>
  <script src="/js/components/KnowledgeBaseView.js"></script>
  <script src="/js/components/BugReportsView.js"></script>
  <script src="/js/components/SettingsView.js"></script>
  <script src="/js/components/AdminUsersView.js"></script>
  <script src="/js/components/DocsView.js"></script>
  <script src="/js/components/AcademyView.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
